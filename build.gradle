plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.3'
    id 'io.spring.dependency-management' version '1.1.6'  // Update for compatibility with Spring Boot 3.x
    id 'maven-publish'
    id 'jacoco'
}

group 'com.techsophy.tsf'
version '1.2.0'
description = 'tp-cloud-config-server'

repositories {
    mavenCentral()
}

ext {
    set('springCloudVersion', "2023.0.3")  // Compatible with Spring Boot 3.x
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
    }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.cloud:spring-cloud-config-server'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

tasks.named('test') {
    useJUnitPlatform()  // Ensure compatibility with JUnit 5
}